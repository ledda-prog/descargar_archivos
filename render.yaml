services:
  - type: web
    name: mediahub-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: RENDER
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://media-hub-umber.vercel.app
      - key: PUBLIC_BASE_URL
        value: https://media-hub-umber.vercel.app
